name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Install Android build tools
      run: |
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Download Godot 3.5.3
      run: |
        wget -q https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_linux_headless.64.zip
        unzip -q Godot_v3.5.3-stable_linux_headless.64.zip
        chmod +x Godot_v3.5.3-stable_linux_headless.64
        sudo mv Godot_v3.5.3-stable_linux_headless.64 /usr/local/bin/godot

    - name: Download Godot Android export templates
      run: |
        mkdir -p ~/.local/share/godot/templates/3.5.3.stable
        wget -q https://github.com/godotengine/godot/releases/download/3.5.3-stable/Godot_v3.5.3-stable_export_templates.tpz
        unzip -q Godot_v3.5.3-stable_export_templates.tpz
        mv templates/* ~/.local/share/godot/templates/3.5.3.stable/

    - name: Setup Android debug keystore
      run: |
        mkdir -p ~/.android
        keytool -genkeypair \
          -keystore ~/.android/debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

    - name: Configure Godot Android settings
      run: |
        mkdir -p ~/.config/godot
        cat > ~/.config/godot/editor_settings-3.tres << 'EOF'
[gd_resource type="EditorSettings" format=2]
[resource]
export/android/android_sdk_path = "/usr/local/lib/android/sdk"
export/android/debug_keystore = "/home/runner/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

    - name: Create build directory
      run: mkdir -p build

    - name: Export APK
      run: |
        cd $GITHUB_WORKSPACE
        godot --path . --export-debug "Android" build/soviet_apartment.apk || true

    - name: Check if APK was created
      run: |
        if [ -f "build/soviet_apartment.apk" ]; then
          echo "APK created successfully!"
          ls -la build/
        else
          echo "APK not found"
          find . -name "*.apk" 2>/dev/null || true
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: soviet-apartment-apk
        path: build/soviet_apartment.apk
        if-no-files-found: warn
        retention-days: 30
